:root {
  --rpc-canvas: #DCD3BE;
  --rpc-canvas-2: #CBBFA2;
  --rpc-navy: #1B2A4A;
  --rpc-navy-dim: #2E4066;
  --rpc-cream: #F2E8D5;
  --rpc-cream-2: #EDE1C8;
  --rpc-brass: #B8860B;
  --rpc-brass-light: #D8A93A;
  --rpc-paper-line: #C9BC9C;
  --rpc-error: #7A1E1E;
  --rpc-wizard-bg: #FFFFFF;
  --rpc-wizard-ink: #14213D;
  --rpc-wizard-panel: #F4F5F7;
  --rpc-wizard-border-soft: #C7CCD6;
  --rpc-muted: #7A8290;
  --rpc-font-head: 'RPC Oswald', 'Arial Narrow', sans-serif;
  --rpc-font-body: 'RPC Courier', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --rpc-canvas: #14181F;
    --rpc-canvas-2: #1C222C;
  }
}
:root[data-theme="dark"] {
  --rpc-canvas: #14181F;
  --rpc-canvas-2: #1C222C;
}
:root[data-theme="light"] {
  --rpc-canvas: #DCD3BE;
  --rpc-canvas-2: #CBBFA2;
}

/* The certificate and the wizard are treated as physical printed objects --
   ink on paper -- so their own surfaces stay fixed regardless of viewer
   theme, the same way a photograph of a document doesn't invert at night.
   Only the surrounding page canvas they sit on adapts. */

* { box-sizing: border-box; }

.rpc-outer {
  min-height: 100%;
  background: var(--rpc-canvas);
  background-image: radial-gradient(ellipse at top, var(--rpc-canvas-2), var(--rpc-canvas) 70%);
  padding: 36px 16px 56px;
  font-family: var(--rpc-font-body);
}

.rpc-root {
  color: var(--rpc-navy);
}
.rpc-root *, .rpc-root *::before, .rpc-root *::after {
  box-sizing: border-box;
}

.rpc-eyebrow {
  max-width: 900px;
  margin: 0 auto 18px;
  text-align: center;
  font-family: var(--rpc-font-head);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--rpc-muted);
  text-transform: uppercase;
}

/* ============================= WIZARD (utilitarian) ===================== */

.rpc-wizard {
  max-width: 760px;
  margin: 0 auto;
  background: var(--rpc-wizard-bg);
  color: var(--rpc-wizard-ink);
  border: 3px solid var(--rpc-wizard-ink);
}

.rpc-wizard-header {
  padding: 20px 24px 16px;
  border-bottom: 3px solid var(--rpc-wizard-ink);
  background: var(--rpc-wizard-panel);
}
.rpc-doc-code {
  font-family: var(--rpc-font-body);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: #4A5568;
  text-align: right;
}
.rpc-wizard-title {
  font-family: var(--rpc-font-head);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.06em;
  margin: 4px 0 0;
  text-transform: uppercase;
}
.rpc-wizard-subtitle {
  font-family: var(--rpc-font-head);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.08em;
  margin: 2px 0 10px;
  text-transform: uppercase;
  color: #2D3B58;
}
.rpc-classification {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  border: 2px solid var(--rpc-wizard-ink);
  padding: 3px 8px;
  text-transform: uppercase;
}

.rpc-progress {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin: 0;
  padding: 0;
  border-bottom: 3px solid var(--rpc-wizard-ink);
}
.rpc-progress-item {
  padding: 10px 8px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.03em;
  border-right: 1px solid var(--rpc-wizard-border-soft);
  background: var(--rpc-wizard-panel);
  color: var(--rpc-muted);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.rpc-progress-item:last-child { border-right: none; }
.rpc-progress-index {
  font-family: var(--rpc-font-head);
  font-weight: 700;
  font-size: 15px;
}
.rpc-progress-item--active {
  background: var(--rpc-wizard-ink);
  color: #FFFFFF;
}
.rpc-progress-item--done {
  background: #DCE3F0;
  color: var(--rpc-wizard-ink);
}

.rpc-wizard-panel { padding: 24px; }

.rpc-fieldset { border: none; margin: 0; padding: 0; }
.rpc-section-title {
  font-family: var(--rpc-font-head);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.05em;
  padding: 0 0 4px;
  margin-bottom: 6px;
  border-bottom: 2px solid var(--rpc-wizard-ink);
  width: 100%;
}
.rpc-section-help {
  font-size: 12.5px;
  line-height: 1.5;
  color: #445;
  margin: 8px 0 18px;
}

.rpc-field { margin-bottom: 16px; }
.rpc-label {
  display: block;
  font-size: 12.5px;
  font-weight: 700;
  margin-bottom: 5px;
  letter-spacing: 0.02em;
}
.rpc-label::after { content: ":"; }
.rpc-required { color: var(--rpc-error); font-weight: 700; }
.rpc-optional { color: var(--rpc-muted); font-weight: 400; }

.rpc-input {
  width: 100%;
  font-family: var(--rpc-font-body);
  font-size: 16px;
  padding: 9px 10px;
  border: 2px solid var(--rpc-wizard-ink);
  background: #FFFFFF;
  color: var(--rpc-wizard-ink);
}
.rpc-input:focus { outline: 3px solid var(--rpc-brass); outline-offset: 0; }
.rpc-input--nested { margin-top: 8px; }
.rpc-input--invalid { border-color: var(--rpc-error); background: #FBEAEA; }
.rpc-select { appearance: auto; }
.rpc-textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
.rpc-hidden { display: none !important; }

.rpc-form-error {
  color: var(--rpc-error);
  font-size: 12.5px;
  font-weight: 700;
  border: 2px solid var(--rpc-error);
  background: #FBEAEA;
  padding: 8px 10px;
  margin: 6px 0 0;
}

.rpc-wizard-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 22px;
  padding-top: 18px;

<script>
(function () {
  "use strict";

    "Unified Mining Consortium",
    "Stellar Dynamics Corporation",
    "Helix Pharmaceutical Group",
    "Omega Security Solutions",
    "Genesis Tech Industries"
  ];

  var SPECIALIZATIONS = [

    "Communications & Intelligence",

  /* -----------------------------------------------------------------------

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fnv1aHash(str) {
    var hash = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      hash ^= str.charCodeAt(i);
      hash = Math.imul(hash, 0x01000193);
    }
    return hash >>> 0;
  }

  function generateCorporateId(subdivisionName, seedTimestamp) {
    var seed = subdivisionName.trim().toLowerCase() + "::" + seedTimestamp;
    var hash = fnv1aHash(seed);
    var sixDigit = String(hash % 1000000);
    while (sixDigit.length < 6) sixDigit = "0" + sixDigit;
    return "MCI-" + sixDigit;
  }

  function getTerranDate(date) {
    var start = new Date(date.getFullYear(), 0, 0);
    var diffMs = date - start;
    var dayOfYear = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    var d = String(dayOfYear);
    while (d.length < 3) d = "0" + d;
    return "Terran Date 2159." + d;
  }

  function makeEmptyFormData() {
    return {
      subdivisionName: "",
      managerName: "",
      parentCorporation: "",
      specialization: "",
      specializationOther: "",
      missionStatement: "",
      objectives: "",
      startingFacility: "",
      cooperationPolicy: "",
      history: ""
    };
  }

  function resolvedSpecialization(data) {
    return data.specialization === "Other (specify)"
      ? data.specializationOther.trim()
      : data.specialization;
  }

  function isStepComplete(stepKey, data) {
    switch (stepKey) {
      case "identity":
        return (
          data.subdivisionName.trim() !== "" &&
          data.managerName.trim() !== "" &&
          data.parentCorporation !== "" &&
          data.specialization !== "" &&
          (data.specialization !== "Other (specify)" || data.specializationOther.trim() !== "")
        );
      case "operations":
        return (
          data.startingFacility !== "" &&
          data.cooperationPolicy !== "" &&
          data.missionStatement.trim() !== ""
        );
      case "filings":
        return data.objectives.trim() !== "";
      case "review":
        return true;
      default:
        return true;
    }
  }

  function optionsHtml(list, selected, placeholder) {
    var html = '<option value="">' + escapeHtml(placeholder) + "</option>";
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      html +=
        '<option value="' + escapeHtml(v) + '"' + (v === selected ? " selected" : "") + ">" +
        escapeHtml(v) +
        "</option>";
    }
    return html;
  }

  /* -----------------------------------------------------------------------
   * State
   * -------------------------------------------------------------------- */

  var state = {
    stepIndex: 0,
    formData: makeEmptyFormData(),
    certificate: null, // { corporateId, issueDate }
    attemptedNext: false
  };

  var root = document.getElementById("rpc-root");

  /* -----------------------------------------------------------------------
   * Wizard markup
   * -------------------------------------------------------------------- */

  function fieldLabel(text, required) {
    return (
      '<label class="rpc-label">' +
      escapeHtml(text) +
      (required
        ? '<span class="rpc-required"> (required)</span>'
        : '<span class="rpc-optional"> (optional)</span>') +
      "</label>"
    );
  }

  function stepIdentityHtml(data, showErrors) {
    var otherHidden = data.specialization === "Other (specify)" ? "" : " rpc-hidden";
    var otherInvalid =
      showErrors && data.specialization === "Other (specify)" && !data.specializationOther.trim()
        ? " rpc-input--invalid"
        : "";
    return (
      '<fieldset class="rpc-fieldset">' +
      '<legend class="rpc-section-title">SUBDIVISION IDENTITY</legend>' +
      '<p class="rpc-section-help">Every subdivision operating under the Mars Colonial Charter must be registered with the Mars Colonial Authority before resources may be allocated. Begin by identifying your subdivision and its command structure.</p>' +
      '<div class="rpc-field">' +
      fieldLabel("Subdivision Name", true) +
      '<input type="text" id="f-subdivisionName" class="rpc-input' +
      (showErrors && !data.subdivisionName.trim() ? " rpc-input--invalid" : "") +
      '" value="' + escapeHtml(data.subdivisionName) + '" placeholder="e.g. Cobalt Reach Subdivision">' +
      "</div>" +
      '<div class="rpc-field">' +
      fieldLabel("Manager Name", true) +
      '<input type="text" id="f-managerName" class="rpc-input' +
      (showErrors && !data.managerName.trim() ? " rpc-input--invalid" : "") +
      '" value="' + escapeHtml(data.managerName) + '" placeholder="In-character name of the Subdivision Manager">' +
      "</div>" +
      '<div class="rpc-field">' +
      fieldLabel("Parent Corporation", true) +
      '<select id="f-parentCorporation" class="rpc-input rpc-select' +
      (showErrors && !data.parentCorporation ? " rpc-input--invalid" : "") +
      '">' +
      optionsHtml(CORPORATIONS, data.parentCorporation, "Select a parent corporation&hellip;") +
      "</select></div>" +
      '<div class="rpc-field">' +
      fieldLabel("Primary Specialization", true) +
      '<select id="f-specialization" class="rpc-input rpc-select' +
      (showErrors && !data.specialization ? " rpc-input--invalid" : "") +
      '">' +
      optionsHtml(SPECIALIZATIONS, data.specialization, "Select a specialization&hellip;") +
      "</select>" +
      '<input type="text" id="f-specializationOther" class="rpc-input rpc-input--nested' + otherInvalid + otherHidden + '" value="' +
      escapeHtml(data.specializationOther) +
      '" placeholder="Specify your subdivision&rsquo;s focus">' +
      "</div>" +
      "</fieldset>"
    );
  }

  function stepOperationsHtml(data, showErrors) {

      '<fieldset class="rpc-fieldset">' +
      '<legend class="rpc-section-title">OPERATIONAL PROFILE</legend>' +

      '<div class="rpc-field">' +
      fieldLabel("Preferred Starting Facility", true) +
      '<select id="f-startingFacility" class="rpc-input rpc-select' +
      (showErrors && !data.startingFacility ? " rpc-input--invalid" : "") +
      '">' +
      optionsHtml(FACILITIES, data.startingFacility, "Select a facility type&hellip;") +
      "</select></div>" +
      '<div class="rpc-field">' +
      fieldLabel("Cooperation Policy", true) +
      '<select id="f-cooperationPolicy" class="rpc-input rpc-select' +
      (showErrors && !data.cooperationPolicy ? " rpc-input--invalid" : "") +

      optionsHtml(COOPERATION_POLICIES, data.cooperationPolicy, "Select a policy&hellip;") +

      '<div class="rpc-field">' +
      fieldLabel("Official Mission Statement", true) +
      '<textarea id="f-missionStatement" rows="3" class="rpc-input rpc-textarea' +
      (showErrors && !data.missionStatement.trim() ? " rpc-input--invalid" : "") +
      '" placeholder="A short, in-character corporate mission statement (1-3 sentences).">' +
      escapeHtml(data.missionStatement) +
      "</textarea></div>" +
      "</fieldset>"
    );
  }

  function stepFilingsHtml(data, showErrors) {
    return (
      '<fieldset class="rpc-fieldset">' +
      '<legend class="rpc-section-title">CORPORATE FILINGS</legend>' +
      '<p class="rpc-section-help">The Authority requires a statement of intent on file for every registered subdivision. History and culture are not mandatory, but the Registration Standards Office notes that subdivisions without a recorded history tend to be assumed to not have one.</p>' +
      '<div class="rpc-field">' +

      "</textarea></div>" +
      "</fieldset>"

  }

  function stepReviewHtml(data) {
    var rows = [
      ["Subdivision Name", data.subdivisionName],
      ["Manager Name", data.managerName],
      ["Parent Corporation", data.parentCorporation],
      ["Primary Specialization", resolvedSpecialization(data)],
      ["Preferred Starting Facility", data.startingFacility],
      ["Cooperation Policy", data.cooperationPolicy],
      ["Official Mission Statement", data.missionStatement],
      ["Corporate Objectives & Personal Aspirations", data.objectives],
      ["Subdivision History / Corporate Culture", data.history || "&mdash;"]
    ];
    var rowsHtml = "";
    for (var i = 0; i < rows.length; i++) {

        '<div class="rpc-review-row"><dt>' +

        "</dt><dd>" +
        escapeHtml(rows[i][1]) +
        "</dd></div>";

    return (
      '<fieldset class="rpc-fieldset">' +
      '<legend class="rpc-section-title">REVIEW &amp; SUBMIT</legend>' +
      '<p class="rpc-section-help">Confirm the filing below. Submitting this form generates a permanent Corporate ID and constitutes a formal registration with the Mars Colonial Authority.</p>' +
      '<dl class="rpc-review-list">' + rowsHtml + "</dl>" +
      "</fieldset>"
    );
  }

  function renderWizard() {
    var step = STEPS[state.stepIndex];
    var complete = isStepComplete(step.key, state.formData);
    var isLast = step.key === "review";

    var progressHtml = "";
    for (var i = 0; i < STEPS.length; i++) {
      var cls = "rpc-progress-item";
      if (i === state.stepIndex) cls += " rpc-progress-item--active";
      else if (i < state.stepIndex) cls += " rpc-progress-item--done";
      progressHtml +=
        '<li class="' + cls + '"><span class="rpc-progress-index">' + (i + 1) +
        '</span><span class="rpc-progress-label">' + escapeHtml(STEPS[i].label) + "</span></li>";
    }

    var bodyHtml = "";
    if (step.key === "identity") bodyHtml = stepIdentityHtml(state.formData, state.attemptedNext);
    else if (step.key === "operations") bodyHtml = stepOperationsHtml(state.formData, state.attemptedNext);
    else if (step.key === "filings") bodyHtml = stepFilingsHtml(state.formData, state.attemptedNext);
    else bodyHtml = stepReviewHtml(state.formData);

    var errorHtml =
      state.attemptedNext && !complete
        ? '<p class="rpc-form-error" role="alert">All fields marked (required) must be completed before proceeding.</p>'
        : "";

    var navHtml =
      '<div class="rpc-wizard-nav">' +
      '<button type="button" class="rpc-btn rpc-btn--ghost" id="btn-back"' +
      (state.stepIndex === 0 ? " disabled" : "") +
      ">&larr; Back</button>" +
      (isLast
        ? '<button type="button" class="rpc-btn rpc-btn--primary" id="btn-submit">Submit Registration &amp; Generate Certificate</button>'
        : '<button type="button" class="rpc-btn rpc-btn--primary" id="btn-next">Next &rarr;</button>') +
      "</div>";

    return (
      '<div class="rpc-wizard">' +
      '<header class="rpc-wizard-header">' +
      '<div class="rpc-doc-code">' + DOCUMENT_CODE + "</div>" +
      '<h1 class="rpc-wizard-title">MARS COLONIAL INITIATIVE</h1>' +
      '<h2 class="rpc-wizard-subtitle">SUBDIVISION MANAGER REGISTRATION</h2>' +
      '<div class="rpc-classification">CLASSIFICATION: REGISTRATION DOCUMENTATION &mdash; PROSPECTIVE SUBDIVISION MANAGERS</div>' +
      "</header>" +
      '<ol class="rpc-progress" aria-label="Registration progress">' + progressHtml + "</ol>" +
      '<div class="rpc-wizard-panel">' + bodyHtml + errorHtml + navHtml + "</div>" +
      '<footer class="rpc-wizard-footer">Form ' + DOCUMENT_CODE + ' &middot; Mars Colonial Authority &middot; Registration Standards Office</footer>' +
      "</div>"
    );
  }

  function renderCertificate() {

      certFieldHtml("Primary Specialization", specialization) +
      certFieldHtml("Preferred Starting Facility", data.startingFacility) +
      certFieldHtml("Cooperation Policy", data.cooperationPolicy) +
      certFieldHtml("Date of Issue", cert.issueDate);

    var historyHtml =
      data.history && data.history.trim() !== ""
        ? '<div class="rpc-cert-block"><div class="rpc-cert-block-label">SUBDIVISION HISTORY / CORPORATE CULTURE</div><p class="rpc-cert-block-text">' +
          escapeHtml(data.history) +
          "</p></div>"
        : "";

    var sealHtml =
      '<svg viewBox="0 0 200 200" class="rpc-cert-seal-svg">' +
      "<defs><path id=\"rpc-seal-path\" d=\"M100,100 m-72,0 a72,72 0 1,1 144,0 a72,72 0 1,1 -144,0\"/></defs>" +
      '<circle cx="100" cy="100" r="95" class="rpc-seal-ring-outer"/>' +
      '<circle cx="100" cy="100" r="82" class="rpc-seal-ring-inner"/>' +
      '<text class="rpc-seal-text"><textPath href="#rpc-seal-path" startOffset="0%">MARS COLONIAL AUTHORITY &bull; SUBDIVISION REGISTRY &bull; MARS COLONIAL AUTHORITY &bull; SUBDIVISION REGISTRY &bull;</textPath></text>' +
      '<circle cx="100" cy="100" r="22" class="rpc-seal-planet"/>' +
      '<ellipse cx="100" cy="100" rx="38" ry="10" class="rpc-seal-orbit" transform="rotate(-20 100 100)"/>' +
      '<circle cx="100" cy="100" r="3" class="rpc-seal-core"/>' +
      "</svg>";

    return (
      '<div class="rpc-cert-screen">' +
      '<div class="rpc-cert-toolbar rpc-no-print">' +
      '<button type="button" class="rpc-btn rpc-btn--primary" id="btn-print">DOWNLOAD CERTIFICATE (PRINT / SAVE AS PDF)</button>' +
      '<button type="button" class="rpc-btn rpc-btn--ghost" id="btn-restart">Register Another Subdivision</button>' +
      "</div>" +
      '<div class="rpc-cert-frame"><div class="rpc-cert-panel">' +
      '<div class="rpc-cert-topline">' +
      '<div class="rpc-cert-classification">CLASSIFICATION: REGISTRATION DOCUMENTATION &mdash; PROSPECTIVE SUBDIVISION MANAGERS</div>' +
      '<div class="rpc-cert-idblock"><div class="rpc-cert-idblock-label">CORPORATE ID</div><div class="rpc-cert-idblock-value">' +
      escapeHtml(cert.corporateId) +
      "</div></div></div>" +
      '<header class="rpc-cert-header">' +
      '<div class="rpc-cert-doc-code">' + DOCUMENT_CODE + "</div>" +
      '<h1 class="rpc-cert-title">MARS COLONIAL INITIATIVE</h1>' +
      '<h2 class="rpc-cert-subtitle">CERTIFICATE OF SUBDIVISION REGISTRATION</h2>' +
      '<div class="rpc-cert-rule" aria-hidden="true"></div>' +
      "</header>" +
      '<p class="rpc-cert-preamble">This certifies that the subdivision named below has been duly registered with the Mars Colonial Authority under the authority of the Mars Colonial Charter of 2159, and is hereby recognized as an operating subdivision of its declared parent corporation, entitled to the rights, resources, and obligations thereof.</p>' +
      '<div class="rpc-cert-grid">' + gridHtml + "</div>" +
      '<div class="rpc-cert-block"><div class="rpc-cert-block-label">OFFICIAL MISSION STATEMENT</div><p class="rpc-cert-block-text">' +
      escapeHtml(data.missionStatement) +
      "</p></div>" +
      '<div class="rpc-cert-block"><div class="rpc-cert-block-label">CORPORATE OBJECTIVES &amp; PERSONAL ASPIRATIONS</div><p class="rpc-cert-block-text">' +
      escapeHtml(data.objectives) +
      "</p></div>" +
      historyHtml +
      '<div class="rpc-cert-signoff">' +
      '<div class="rpc-cert-seal" aria-hidden="true">' + sealHtml + "</div>" +
      '<div class="rpc-cert-signoff-text">' +
      '<div class="rpc-cert-signoff-org">MARS COLONIAL AUTHORITY</div>' +
      '<div class="rpc-cert-signoff-office">Registration Standards Office</div>' +
      '<div class="rpc-cert-signoff-code">' + DOCUMENT_CODE + "</div>" +
      '<div class="rpc-cert-signoff-tagline">Excellence is not optional.</div>' +
      '<div class="rpc-cert-signature-line"><span class="rpc-cert-signature-script">Registration Standards Office</span><span class="rpc-cert-signature-caption">Authorized Signature, Mars Colonial Authority</span></div>' +
      "</div></div>" +
      '<blockquote class="rpc-cert-quote">&ldquo;' + escapeHtml(PULL_QUOTE.text) + '&rdquo;<footer>&mdash; ' + escapeHtml(PULL_QUOTE.attribution) + "</footer></blockquote>" +
      '<div class="rpc-cert-footer">Document ' + DOCUMENT_CODE + " &middot; Corporate ID " + escapeHtml(cert.corporateId) + " &middot; Issued " + escapeHtml(cert.issueDate) + "</div>" +
      "</div></div>" +
      "</div>"
    );
  }

  /* -----------------------------------------------------------------------
   * Event wiring
   * -------------------------------------------------------------------- */

  function bindTextField(id, key) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", function () {
      state.formData[key] = el.value;
    });
  }

  function attachWizardHandlers() {
    bindTextField("f-subdivisionName", "subdivisionName");
    bindTextField("f-managerName", "managerName");
    bindTextField("f-specializationOther", "specializationOther");
    bindTextField("f-missionStatement", "missionStatement");
    bindTextField("f-objectives", "objectives");
    bindTextField("f-history", "history");

    var parentCorp = document.getElementById("f-parentCorporation");
    if (parentCorp) {
      parentCorp.addEventListener("change", function () {
        state.formData.parentCorporation = parentCorp.value;
      });
    }

    var specialization = document.getElementById("f-specialization");
    var specOther = document.getElementById("f-specializationOther");
    if (specialization) {
      specialization.addEventListener("change", function () {
        state.formData.specialization = specialization.value;
        if (specialization.value === "Other (specify)") {
          specOther.classList.remove("rpc-hidden");
        } else {
          specOther.classList.add("rpc-hidden");
          state.formData.specializationOther = "";
          specOther.value = "";
        }
      });
    }

    var startingFacility = document.getElementById("f-startingFacility");
    if (startingFacility) {
      startingFacility.addEventListener("change", function () {
        state.formData.startingFacility = startingFacility.value;
      });
    }

    var cooperationPolicy = document.getElementById("f-cooperationPolicy");
    if (cooperationPolicy) {
      cooperationPolicy.addEventListener("change", function () {
        state.formData.cooperationPolicy = cooperationPolicy.value;
      });
    }

    var backBtn = document.getElementById("btn-back");
    if (backBtn) {
      backBtn.addEventListener("click", function () {
        state.attemptedNext = false;
        state.stepIndex = Math.max(0, state.stepIndex - 1);
        render();
      });
    }

    var nextBtn = document.getElementById("btn-next");
    if (nextBtn) {
      nextBtn.addEventListener("click", function () {
        var step = STEPS[state.stepIndex];
        if (!isStepComplete(step.key, state.formData)) {
          state.attemptedNext = true;
          render();
          return;
        }
        state.attemptedNext = false;
        state.stepIndex = Math.min(STEPS.length - 1, state.stepIndex + 1);
        render();
      });
    }

    var submitBtn = document.getElementById("btn-submit");
    if (submitBtn) {
      submitBtn.addEventListener("click", function () {
        if (
          !isStepComplete("identity", state.formData) ||
          !isStepComplete("operations", state.formData) ||
          !isStepComplete("filings", state.formData)
        ) {
          state.attemptedNext = true;
          render();
          return;
        }
        var now = new Date();
        state.certificate = {
          corporateId: generateCorporateId(state.formData.subdivisionName, now.getTime()),
          issueDate: getTerranDate(now)
        };
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      });
    }
  }

  function attachCertificateHandlers() {
    var printBtn = document.getElementById("btn-print");
    if (printBtn) {
      printBtn.addEventListener("click", function () {
        window.print();
      });
    }
    var restartBtn = document.getElementById("btn-restart");
    if (restartBtn) {
      restartBtn.addEventListener("click", function () {
        state.formData = makeEmptyFormData();
        state.certificate = null;
        state.stepIndex = 0;
        state.attemptedNext = false;
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      });
    }
  }

  function render() {
    if (state.certificate) {
      root.innerHTML = renderCertificate();
      attachCertificateHandlers();
    } else {
      root.innerHTML = renderWizard();
      attachWizardHandlers();
    }
  }

  render();
})();
</script>
